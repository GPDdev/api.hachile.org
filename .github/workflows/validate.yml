name: Validate deployment configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation and schema
        env:
          SESSION_SECRET: validation-only-not-a-deployment-secret
        run: docker compose -f compose.yaml config --quiet
